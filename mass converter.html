<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #d9d9d9;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #f3f3f3;
            padding: 30px;
            border-radius: 0;
            width: 320px;
            max-width: calc(100% - 60px);
            border: 2px solid #444;
            box-shadow: none;
        }

        h1 {
            text-align: center;
            color: #111;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border-radius: 0;
            border: 1px solid #444;
            background: #fff;
            color: #111;
        }

        button {
            background: #e0e0e0;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #cfcfcf;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            color: #111;
            min-height: 24px;
        }

        #error {
            color: #333;
            text-align: center;
            min-height: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mass Converter</h1>

        <label for="amount">Amount</label>
        <input id="amount" type="number" step="any" min="0" placeholder="Enter value">

        <label for="fromUnit">From</label>
        <select id="fromUnit">
            <option value="kg">Kilograms (kg)</option>
            <option value="g">Grams (g)</option>
            <option value="mg">Milligrams (mg)</option>
            <option value="lb">Pounds (lb)</option>
            <option value="oz">Ounces (oz)</option>
        </select>

        <label for="toUnit">To</label>
        <select id="toUnit">
            <option value="kg">Kilograms (kg)</option>
            <option value="g" selected>Grams (g)</option>
            <option value="mg">Milligrams (mg)</option>
            <option value="lb">Pounds (lb)</option>
            <option value="oz">Ounces (oz)</option>
        </select>

        <button onclick="convertMass()">Convert</button>
        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        const unitToKg = {
            kg: 1,
            g: 0.001,
            mg: 0.000001,
            lb: 0.45359237,
            oz: 0.0283495231
        };

        function convertMass() {
            const amountInput = document.getElementById('amount');
            const fromUnit = document.getElementById('fromUnit').value;
            const toUnit = document.getElementById('toUnit').value;
            const errorBox = document.getElementById('error');
            const resultBox = document.getElementById('result');

            const amount = Number(amountInput.value);

            if (amountInput.value === '' || Number.isNaN(amount) || amount < 0) {
                errorBox.textContent = 'Please enter a valid non-negative number.';
                resultBox.textContent = '';
                return;
            }

            const resultValue = (amount * unitToKg[fromUnit]) / unitToKg[toUnit];
            const formatted = Math.abs(resultValue) >= 100 ? resultValue.toFixed(2) : resultValue.toFixed(6);

            errorBox.textContent = '';
            resultBox.textContent = `${amount} ${fromUnit} = ${formatted} ${toUnit}`;
        }
    </script>
</body>
</html>
